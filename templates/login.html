<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">
    <title>Pieteikšanās</title>
</head>

<body>

    <p>
        <a href="/">← Atpakaļ uz sākumlapu</a>
    </p>

    <h1>Pieteikšanās</h1>

    {% if error %}
        <p>
            <strong>{{ error }}</strong>
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label for="email">
                <strong>E-pasts:</strong>
            </label>
            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="password">
                <strong>Parole:</strong>
            </label>
            <br>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <button type="submit">
            Pieteikties
        </button>

    </form>

    <p>
        Nav konta?
        <a href="/register">Reģistrēties</a>
    </p>

</body>

</html>
