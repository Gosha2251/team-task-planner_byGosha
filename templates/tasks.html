<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Uzdevumi</title>
</head>
<body>

<p>
    <a href="/tasks/add">
        Pievienot uzdevumu
    </a>
</p>

<h1>Uzdevumi</h1>

<ul>

{% for task in tasks %}

<li>
    <strong>{{ task.title }}</strong>
    -
    {{ task.status }}

    <a href="/tasks/{{ task.id }}">Atvērt</a>

    <br>

    {{ task.description }}
</li>

{% endfor %}

</ul>

</body>
</html>
